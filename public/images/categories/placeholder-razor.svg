<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FAF8F5"/>
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#E8E2D9" stroke-width="2"/>
  <g transform="translate(160, 75)" stroke="#57534E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Razor head -->
    <rect x="15" y="15" width="50" height="20" rx="3" fill="#F5F0E6"/>
    <!-- Razor blades lines -->
    <line x1="22" y1="21" x2="58" y2="21" stroke-width="1.5"/>
    <line x1="22" y1="27" x2="58" y2="27" stroke-width="1.5"/>
    <!-- Pivot / Neck -->
    <path d="M35 35 L35 45 L40 50 L45 45 L45 35"/>
    <!-- Handle -->
    <path d="M38 50 L36 95 C36 98, 44 98, 44 95 L42 50 Z" fill="#E8E2D9"/>
    <!-- Grip ridges -->
    <line x1="37" y1="65" x2="43" y2="65" stroke-width="1.5"/>
    <line x1="37" y1="75" x2="43" y2="75" stroke-width="1.5"/>
  </g>
  <text x="200" y="215" text-anchor="middle" font-family="serif" font-size="15" font-weight="bold" fill="#292524" letter-spacing="0.5">Shaving &amp; Grooming Kits</text>
  <text x="200" y="235" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#78716C" letter-spacing="2">LUXURY GUEST GROOMING AMENITIES</text>
</svg>
